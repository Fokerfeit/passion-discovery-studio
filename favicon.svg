<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- rounded square background — reads like an app icon -->
  <rect width="64" height="64" rx="14" fill="#000000"/>

  <!-- subtle teal glow behind base -->
  <circle cx="32" cy="54" r="10" fill="#00c9b1" opacity="0.12"/>

  <!-- trunk -->
  <line x1="32" y1="54" x2="32" y2="34" stroke="#00c9b1" stroke-width="3.5" stroke-linecap="round"/>

  <!-- left branch -->
  <line x1="32" y1="40" x2="15" y2="20" stroke="#00c9b1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- center branch -->
  <line x1="32" y1="34" x2="32" y2="12" stroke="#00c9b1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- right branch -->
  <line x1="32" y1="40" x2="49" y2="20" stroke="#00c9b1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- star at left tip -->
  <circle cx="15" cy="18" r="3.5" fill="#00c9b1"/>

  <!-- star at right tip -->
  <circle cx="49" cy="18" r="3.5" fill="#00c9b1"/>

  <!-- brightest star — top center -->
  <circle cx="32" cy="10" r="4" fill="#ffffff"/>
  <circle cx="32" cy="10" r="2" fill="#00c9b1"/>

  <!-- glowing spark at base (the child's chest point) -->
  <circle cx="32" cy="54" r="4.5" fill="#00c9b1" opacity="0.5"/>
  <circle cx="32" cy="54" r="2.5" fill="#ffffff"/>
</svg>

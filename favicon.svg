<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- black background circle -->
  <circle cx="32" cy="32" r="32" fill="#000000"/>

  <!-- soft outer glow ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00c9b1" stroke-width="1" opacity="0.18"/>

  <!-- 4-pointed spark / star — teal -->
  <path d="
    M32 10
    C32 10, 33.6 28.4, 54 32
    C54 32, 33.6 35.6, 32 54
    C32 54, 30.4 35.6, 10 32
    C10 32, 30.4 28.4, 32 10
    Z
  " fill="#00c9b1"/>

  <!-- bright white center point -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" opacity="0.95"/>

  <!-- subtle inner teal halo -->
  <circle cx="32" cy="32" r="7" fill="#00c9b1" opacity="0.25"/>
</svg>
